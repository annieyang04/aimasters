<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>2026 AI MASTERS 貴賓報到核銷系統</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 12px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 440px; }
    header { text-align: center; margin-bottom: 10px; }
    h1 { font-size: 1.25rem; margin: 4px 0; color: #38bdf8; }
    p.sub { font-size: 0.85rem; color: #94a3b8; margin: 0; }
    
    #reader-wrapper {
      position: relative;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      border: 2px solid #334155;
    }
    #reader { width: 100%; }
    
    /* 瞄準框 */
    .scan-guide {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 220px; height: 220px;
      border: 2px dashed rgba(56, 189, 248, 0.7);
      border-radius: 8px;
      pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4);
    }

    /* 資訊卡片 */
    .card { background: #1e293b; border-radius: 12px; padding: 16px; margin-top: 12px; border: 1px solid #334155; }
    
    /* 明顯的狀態標籤 */
    .status-badge { 
      display: block; 
      text-align: center;
      padding: 10px; 
      border-radius: 8px; 
      font-size: 1.1rem; 
      font-weight: bold; 
      margin-bottom: 12px; 
      letter-spacing: 1px;
    }
    .status-idle { background: #334155; color: #cbd5e1; }
    .status-syncing { background: #0369a1; color: #ffffff; animation: pulse 1.2s infinite; }
    .status-success { background: #15803d; color: #ffffff; border: 2px solid #4ade80; }
    .status-warning { background: #b45309; color: #ffffff; border: 2px solid #fde047; }
    .status-error { background: #b91c1c; color: #ffffff; border: 2px solid #f87171; }
    
    @keyframes pulse {
      0% { opacity: 0.7; }
      50% { opacity: 1; }
      100% { opacity: 0.7; }
    }

    .info-row { display: flex; justify-content: space-between; margin: 8px 0; font-size: 0.95rem; border-bottom: 1px solid #283548; padding-bottom: 6px; }
    .info-label { color: #94a3b8; }
    .info-val { font-weight: bold; }
    
    /* 詳細訊息文字提示 */
    #resMsg {
      margin-top: 10px;
      padding: 10px;
      background: #0f172a;
      border-radius: 6px;
      font-size: 0.9rem;
      line-height: 1.4;
      min-height: 42px;
    }

    /* 下一位按鈕 */
    #btnNext {
      width: 100%;
      padding: 15px;
      font-size: 1.15rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #0284c7;
      color: white;
      margin-top: 14px;
      display: none;
      box-shadow: 0 4px 10px rgba(2, 132, 199, 0.4);
    }
    #btnNext:active { background: #0369a1; transform: scale(0.98); }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>2026 AI MASTERS 現場報到</h1>
    <p class="sub">對準貴賓手機信件中的 QR Code</p>
  </header>

  <div id="reader-wrapper">
    <div id="reader"></div>
    <div class="scan-guide" id="scanGuide"></div>
  </div>

  <div class="card">
    <div id="statusBadge" class="status-badge status-idle">待機中，請對準 QR Code</div>
    
    <div class="info-row">
      <span class="info-label">報到編號</span>
      <span class="info-val" id="resId" style="color: #38bdf8; font-size: 1.1rem;">--</span>
    </div>
    <div class="info-row">
      <span class="info-label">貴賓姓名</span>
      <span class="info-val" id="resName">--</span>
    </div>
    
    <div id="resMsg" style="color: #94a3b8;">系統就緒，等待掃描...</div>

    <button id="btnNext" onclick="resumeScanning()">👉 繼續掃描下一位</button>
  </div>
</div>

<script>
  // 🔴 請確保這是您最新的 Apps Script Web App URL
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyaQeuj9w423Q6aD5FzRJt7k2c8_L0e1we4suCzf3s3qqDgCCyxqWLd1XTGnnx5hls/exec";

  let scanner = null;
  let isLocked = false;

  // 1. 雙頻音效引擎
  function playSound(type) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      
      if (type === "success") {
        // 成功音：清脆兩段高音
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.setValueAtTime(1760, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
      } else if (type === "warning") {
        // 重複報到音：兩段低沉警告音
        osc.frequency.setValueAtTime(440, ctx.currentTime);
        osc.frequency.setValueAtTime(330, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.4, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.35);
      } else {
        // 失敗音：急促短低音
        osc.frequency.setValueAtTime(220, ctx.currentTime);
        gain.gain.setValueAtTime(0.4, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      }
    } catch(e) {}
  }

  // 2. 初始化高速相機
  function initScanner() {
    scanner = new Html5Qrcode("reader");

    const cameraConfig = {
      fps: 20, // 高採樣率，快速捕獲條碼
      qrbox: { width: 220, height: 220 },
      videoConstraints: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    };

    scanner.start(
      { facingMode: "environment" },
      cameraConfig,
      onScanSuccess
    ).catch(err => {
      document.getElementById("resMsg").innerText = "❌ 無法開啟相機，請確認瀏覽器相機權限與 HTTPS 連線。";
    });
  }

  // 3. 掃描觸發
  async function onScanSuccess(decodedText) {
    if (isLocked) return;
    isLocked = true; // 立即上鎖，避免重疊掃描

    // 暫停相機
    scanner.pause();
    document.getElementById("scanGuide").style.display = "none";

    // 提取畫面基本文字
    const idMatch = decodedText.match(/報到序號[:：]\s*([A-Za-z0-9\-]+)/);
    const nameMatch = decodedText.match(/姓名[:：]\s*([^\n\r]+)/);
    
    document.getElementById("resId").innerText = idMatch ? idMatch[1].trim() : "識別中...";
    document.getElementById("resName").innerText = nameMatch ? nameMatch[1].trim() : "識別中...";

    // 畫面進入「核銷中」狀態
    updateBadge("syncing", "🔄 資料驗證核銷中...");
    document.getElementById("resMsg").innerText = "正在連線試算表驗證身分與報到紀錄，請稍候...";

    try {
      // 呼叫 Google Apps Script 後端
      const response = await fetch(GAS_API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ qrText: decodedText })
      });

      const res = await response.json();

      // ==========================================
      // 根據 Google Sheet 回傳的真實狀態精確判定
      // ==========================================
      if (res.status === "success") {
        // ✅ 報到成功
        playSound("success");
        updateBadge("success", "✅ 報到成功！歡迎蒞臨");
        document.getElementById("resId").innerText = res.guest.id;
        document.getElementById("resName").innerText = res.guest.name || "--";
        document.getElementById("resMsg").innerHTML = `<span style="color: #4ade80;">成功寫入試算表！核銷時間：${res.guest.checkinTime}</span>`;
      } 
      else if (res.status === "warning") {
        // ⚠️ 重複報到
        playSound("warning");
        if (navigator.vibrate) navigator.vibrate([150, 100, 150]); // 雙震動提醒
        updateBadge("warning", "⚠️ 重複報到！請注意");
        if (res.guest) {
          document.getElementById("resId").innerText = res.guest.id;
          document.getElementById("resName").innerText = res.guest.name || "--";
        }
        document.getElementById("resMsg").innerHTML = `<span style="color: #fde047; font-weight: bold;">${res.message}</span>`;
      } 
      else {
        // ❌ 報到失敗（查無此人或非本活動）
        playSound("error");
        updateBadge("error", "❌ 報到失敗");
        document.getElementById("resMsg").innerHTML = `<span style="color: #f87171;">${res.message}</span>`;
      }

    } catch (err) {
      playSound("error");
      updateBadge("error", "網路連線異常");
      document.getElementById("resMsg").innerText = "無法連線至 Google 試算表，請檢查網路狀態或重試。";
    } finally {
      // 一律顯示「繼續掃描下一位」大按鈕
      document.getElementById("btnNext").style.display = "block";
    }
  }

  // 4. 重啟掃描下一位
  function resumeScanning() {
    document.getElementById("btnNext").style.display = "none";
    document.getElementById("scanGuide").style.display = "block";
    
    updateBadge("idle", "待機中，請對準 QR Code");
    document.getElementById("resId").innerText = "--";
    document.getElementById("resName").innerText = "--";
    document.getElementById("resMsg").innerText = "系統就緒，等待掃描...";
    
    isLocked = false;
    scanner.resume();
  }

  function updateBadge(state, text) {
    const badge = document.getElementById("statusBadge");
    badge.className = `status-badge status-${state}`;
    badge.innerText = text;
  }

  window.addEventListener("load", initScanner);
</script>
</body>
</html>
