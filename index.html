<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>2026 AI MASTERS 極速報到系統</title>
  <!-- 引入最新版純前端掃碼函式庫 -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 12px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 440px; }
    header { text-align: center; margin-bottom: 10px; }
    h1 { font-size: 1.2rem; margin: 4px 0; color: #38bdf8; }
    p.sub { font-size: 0.8rem; color: #94a3b8; margin: 0; }
    
    /* 掃描區域優化 */
    #reader-wrapper {
      position: relative;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      border: 2px solid #334155;
    }
    #reader { width: 100%; }
    
    /* 瞄準準心動態效果 */
    .scan-guide {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 220px; height: 220px;
      border: 2px dashed rgba(56, 189, 248, 0.7);
      border-radius: 8px;
      pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4);
    }

    /* 資訊卡片 */
    .card { background: #1e293b; border-radius: 12px; padding: 16px; margin-top: 12px; border: 1px solid #334155; }
    .status-badge { display: inline-block; padding: 4px 12px; border-radius: 9999px; font-size: 0.85rem; font-weight: bold; margin-bottom: 8px; }
    .status-idle { background: #334155; color: #94a3b8; }
    .status-syncing { background: #0369a1; color: #7dd3fc; }
    .status-success { background: #065f46; color: #34d399; }
    .status-warning { background: #854d0e; color: #fde047; }
    .status-error { background: #991b1b; color: #f87171; }
    
    .info-row { display: flex; justify-content: space-between; margin: 8px 0; font-size: 0.95rem; border-bottom: 1px solid #283548; padding-bottom: 6px; }
    .info-label { color: #94a3b8; }
    .info-val { font-weight: bold; }
    
    /* 下一位按鈕（超大按鍵防呆好點擊） */
    #btnNext {
      width: 100%;
      padding: 15px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #0284c7;
      color: white;
      margin-top: 14px;
      box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.3);
      display: none;
    }
    #btnNext:active { background: #0369a1; transform: scale(0.98); }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>2026 AI MASTERS 現場報到</h1>
    <p class="sub">對準 QR Code 即可瞬間辨識</p>
  </header>

  <div id="reader-wrapper">
    <div id="reader"></div>
    <div class="scan-guide" id="scanGuide"></div>
  </div>

  <div class="card">
    <div id="statusBadge" class="status-badge status-idle">● 相機準備就緒，請對準 QR Code</div>
    <div class="info-row">
      <span class="info-label">報到編號</span>
      <span class="info-val" id="resId" style="color: #38bdf8; font-size: 1.1rem;">--</span>
    </div>
    <div class="info-row">
      <span class="info-label">貴賓姓名</span>
      <span class="info-val" id="resName">--</span>
    </div>
    <div class="info-row">
      <span class="info-label">核銷狀態</span>
      <span class="info-val" id="resMsg" style="font-size: 0.85rem; color: #cbd5e1;">等待掃描...</span>
    </div>

    <button id="btnNext" onclick="resumeScanning()">👉 繼續掃描下一位</button>
  </div>
</div>

<script>
  // 🔴 請填入您的 Google Apps Script 部署 URL
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyaQeuj9w423Q6aD5FzRJt7k2c8_L0e1we4suCzf3s3qqDgCCyxqWLd1XTGnnx5hls/exec";

  let scanner = null;
  let isLocked = false; // 防止重複觸發

  // 1. 手機音效引擎（免外部 mp3 檔案，利用 Web Audio API 瞬間產生清脆嗶聲）
  function playBeep(isSuccess = true) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      
      if (isSuccess) {
        // 成功音效：清脆高音 1200Hz
        osc.frequency.setValueAtTime(1200, ctx.currentTime);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.12);
      } else {
        // 失敗/警告：低音 400Hz
        osc.frequency.setValueAtTime(400, ctx.currentTime);
        gain.gain.setValueAtTime(0.4, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      }
    } catch(e) {}
  }

  // 2. 初始化極速相機
  function initFastScanner() {
    scanner = new Html5Qrcode("reader");

    // 精準設定解析度與較高的辨識 FPS，大幅提升反應速度
    const cameraConfig = {
      fps: 20, // 調升每秒取樣次數到 20 次
      qrbox: { width: 220, height: 220 },
      videoConstraints: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    };

    scanner.start(
      { facingMode: "environment" },
      cameraConfig,
      onScanSuccess
    ).catch(err => {
      document.getElementById("resMsg").innerText = "無法存取相機，請確認允許鏡頭權限並使用 HTTPS 連線。";
    });
  }

  // 3. 掃描成功瞬發反應
  async function onScanSuccess(decodedText) {
    if (isLocked) return;
    isLocked = true;

    // 立即暫停畫面，不再辨識任何新條碼
    scanner.pause();
    document.getElementById("scanGuide").style.display = "none";

    // 震動手機 (若手機硬體支援)
    if (navigator.vibrate) navigator.vibrate(100);

    // ==========================================
    // ⚡ 瞬間提取前端資訊 (0.05 秒瞬發顯示)
    // ==========================================
    let regId = "--";
    let name = "--";
    
    const idMatch = decodedText.match(/報到序號[:：]\s*([A-Za-z0-9\-]+)/);
    if (idMatch) regId = idMatch[1].trim();

    const nameMatch = decodedText.match(/姓名[:：]\s*([^\n\r]+)/);
    if (nameMatch) name = nameMatch[1].trim();

    document.getElementById("resId").innerText = regId;
    document.getElementById("resName").innerText = name;

    // 播放提示聲，讓現場人員立刻知道「有抓到了」
    playBeep(true);

    // 顯示為連線試算表中
    updateBadge("syncing", "🔄 資料同步核銷中...");
    document.getElementById("resMsg").innerText = "已辨識貴賓資料，正在回寫 Google 試算表...";

    // 顯示按鈕（讓工作人員可以隨時點下一位）
    document.getElementById("btnNext").style.display = "block";

    // ==========================================
    // 背景非同步送到後端 Google Apps Script
    // ==========================================
    try {
      const response = await fetch(GAS_API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ qrText: decodedText })
      });

      const res = await response.json();

      if (res.status === "success") {
        updateBadge("success", "✅ 核銷完成，歡迎蒞臨");
        document.getElementById("resMsg").innerText = `已於 ${res.guest.checkinTime} 登記報到！`;
      } else if (res.status === "warning") {
        playBeep(false); // 發出警告嗶聲
        updateBadge("warning", "⚠️ 重複報到");
        document.getElementById("resMsg").innerText = res.message;
      } else {
        playBeep(false);
        updateBadge("error", "❌ 報到失敗");
        document.getElementById("resMsg").innerText = res.message;
      }
    } catch (err) {
      updateBadge("error", "網路同步失敗");
      document.getElementById("resMsg").innerText = "無法連線至試算表，請確認網路連線。";
    }
  }

  // 4. 點選「繼續掃描下一位」
  function resumeScanning() {
    document.getElementById("btnNext").style.display = "none";
    document.getElementById("scanGuide").style.display = "block";
    updateBadge("idle", "● 相機準備就緒，請對準 QR Code");
    
    document.getElementById("resId").innerText = "--";
    document.getElementById("resName").innerText = "--";
    document.getElementById("resMsg").innerText = "等待掃描...";
    
    isLocked = false;
    scanner.resume(); // 重啟相機取樣
  }

  function updateBadge(state, text) {
    const badge = document.getElementById("statusBadge");
    badge.className = `status-badge status-${state}`;
    badge.innerText = text;
  }

  window.addEventListener("load", initFastScanner);
</script>
</body>
</html>
